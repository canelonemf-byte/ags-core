services:
  ags-core:
    build: .
    container_name: ags-core
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ags-net]

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    container_name: litellm-proxy
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config","/app/config.yaml","--port","4000"]
    env_file: .env
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ags-net]

networks:
  ags-net:
    driver: bridge
