model_list:
  - model_name: "gpt-primary"
    litellm_params:
      model: "os.environ/OPENAI_MODEL"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "claude-primary"
    litellm_params:
      model: "os.environ/ANTHROPIC_MODEL"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "gemini-primary"
    litellm_params:
      model: "os.environ/GEMINI_MODEL"
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: "grok-primary"
    litellm_params:
      model: "os.environ/XAI_MODEL"
      api_key: "os.environ/XAI_API_KEY"

  - model_name: "kimi-primary"
    litellm_params:
      model: "os.environ/MOONSHOT_MODEL"
      api_key: "os.environ/MOONSHOT_API_KEY"

  - model_name: "perplexity-primary"
    litellm_params:
      model: "os.environ/PERPLEXITY_MODEL"
      api_key: "os.environ/PERPLEXITYAI_API_KEY"

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  retry_after: 1

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  salt_key: "os.environ/LITELLM_SALT_KEY"
